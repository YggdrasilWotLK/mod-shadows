name: ubuntu-build

on:
  push:
  pull_request:

concurrency:
  group: "core-build-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false
      matrix:
        # single build: latest ubuntu only
        include:
          - os: ubuntu-24.04
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release
            
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}-${{ matrix.cpp_compiler }}

    steps:
      - name: Checkout YggdrasilCore
        uses: actions/checkout@v3
        with:
          repository: 'YggdrasilWotLK/yggdrasilcore'
          ref: 'master-shadows'

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
          
      - name: Checkout Shadows Module
        uses: actions/checkout@v3
        with:
          repository: 'YggdrasilWotLK/mod-shadows'
          path: 'modules/mod-shadows'
      
      - name: Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/var/ccache
          key: ccache:${{ matrix.os }}:${{ matrix.c_compiler }}:${{ github.ref }}:${{ github.sha }}
          restore-keys: |
            ccache:${{ matrix.os }}:${{ matrix.c_compiler }}:${{ github.ref }}
            ccache:${{ matrix.os }}:${{ matrix.c_compiler }}
            ccache:${{ matrix.os }}

      - name: Install Requirements
        run: sudo apt-get update && sudo apt-get install ccache git cmake make gcc g++ clang libmysqlclient-dev libssl-dev libbz2-dev libreadline-dev libncurses-dev mysql-server libboost-all-dev

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_FLAGS="-DMOD_SHADOWS"
          -DCMAKE_CXX_FLAGS="-DMOD_SHADOWS"
          -DCMAKE_C_COMPILER_LAUNCHER="ccache"
          -DCMAKE_CXX_COMPILER_LAUNCHER="ccache"
          -S ${{ github.workspace }}

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel $(nproc)
